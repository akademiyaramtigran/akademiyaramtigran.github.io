# Firebase'e yükleme (bulut fonksiyonu + Firestore kuralları + Storage kuralları)
# Elle çalıştırılır: GitHub → Actions → "Firebase'e yükle" → Run workflow.
# Gerekli tek ayar: depo sırrı FIREBASE_SERVICE_ACCOUNT (hizmet hesabı JSON anahtarı) —
# adımlar SATIN_ALMA_REHBERI.md içinde.
name: Firebase'e yükle

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Ne yüklensin?"
        type: choice
        default: hepsi
        options:
          - hepsi
          - kurallar
          - fonksiyon
          - site
          - giris-sertlestir

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Anahtar var mı?
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT sırrı eklenmemiş — SATIN_ALMA_REHBERI.md adım 4'e bakın."
            exit 1
          fi

      - name: Fonksiyon bağımlılıkları
        if: inputs.hedef == 'fonksiyon' || inputs.hedef == 'hepsi'
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions

      - name: Ön derleme (uygulama JSX → app.<özet>.js)
        if: inputs.hedef == 'site' || inputs.hedef == 'hepsi'
        run: node tools/on-derle.js

      - name: Yükle
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HEDEF: ${{ inputs.hedef }}
        run: |
          KEY="$RUNNER_TEMP/sa.json"
          printf '%s' "$SA" > "$KEY"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY"
          # Firebase, Blaze planını Cloud Billing API ile doğrular; bu API kendiliğinden açılmaz.
          # Hizmet hesabında Editor rolü olduğundan burada açılır (zaten açıksa hiçbir şey olmaz).
          if command -v gcloud >/dev/null 2>&1; then
            gcloud auth activate-service-account --key-file="$KEY" --quiet
            gcloud services enable cloudbilling.googleapis.com --project aram2026-a9fd7 --quiet \
              || echo "::warning::Cloud Billing API açılamadı — Console'dan elle açın"
          fi
          if [ "$HEDEF" = "giris-sertlestir" ]; then
            # Giriş sertleştirme: uygulamadan HESAP AÇMA kapatılır (tüm hesaplar yalnız sunucu fonksiyonuyla açılır),
            # kullanıcı kendi hesabını silemez, e-posta numaralandırma koruması açılır. Sırlar yazdırılmaz.
            TOKEN=$(gcloud auth print-access-token)
            URL="https://identitytoolkit.googleapis.com/admin/v2/projects/aram2026-a9fd7/config"
            MASK="client.permissions.disabledUserSignup,client.permissions.disabledUserDeletion,emailPrivacyConfig.enableImprovedEmailPrivacy"
            curl -sS --fail-with-body -X PATCH "$URL?updateMask=$MASK" \
              -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: aram2026-a9fd7" -H "Content-Type: application/json" \
              -d '{"client":{"permissions":{"disabledUserSignup":true,"disabledUserDeletion":true}},"emailPrivacyConfig":{"enableImprovedEmailPrivacy":true}}' \
              -o "$RUNNER_TEMP/cfg.json"
            node -e 'const c=require(process.argv[1]);console.log("disabledUserSignup:",c.client?.permissions?.disabledUserSignup,"| disabledUserDeletion:",c.client?.permissions?.disabledUserDeletion,"| improvedEmailPrivacy:",c.emailPrivacyConfig?.enableImprovedEmailPrivacy)' "$RUNNER_TEMP/cfg.json"
            rm -f "$RUNNER_TEMP/cfg.json" "$KEY"
            exit 0
          fi
          case "$HEDEF" in
            kurallar)  ONLY="firestore:rules,storage" ;;
            fonksiyon) ONLY="functions" ;;
            site)      ONLY="hosting" ;;
            *)         ONLY="firestore:rules,storage,functions,hosting" ;;
          esac
          npx --yes firebase-tools@13 deploy --only "$ONLY" --project aram2026-a9fd7 --non-interactive --force
          rm -f "$KEY"
