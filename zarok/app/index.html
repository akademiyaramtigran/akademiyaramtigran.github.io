<style>
:root{
  /* Konservatuara Aram Tîgran — Model C: krem kâğıt, lacivert mürekkep, altın */
  --bg:#f6f3ee; --card:#ffffff; --ink:#0f2f38; --muted:#5b7079; --line:#e7e2d9;
  --brand:#0f2f38; --brand2:#1d5a66; --sun:#b8923f; --coral:#b8923f; --grass:#1f7a4d; --sky:#1d5a66; --plum:#6e2a3a;
  --soft:#efe9df; --ok:#1f7a4d; --bad:#b3261e; --gold:#b8923f;
  --r:14px; --shadow:0 1px 2px rgba(15,47,56,.05),0 6px 18px rgba(15,47,56,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1d23; --card:#132c34; --ink:#eef2f1; --muted:#a3b3b8; --line:#244049; --soft:#18333b; --shadow:0 6px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{--bg:#0b1d23;--card:#132c34;--ink:#eef2f1;--muted:#a3b3b8;--line:#244049;--soft:#18333b;--shadow:0 6px 18px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.serif,.top .t1,.login h1,.h,.kidmode h2{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.banner{background:var(--coral);color:#fff;text-align:center;font-weight:800;font-size:13px;padding:6px calc(10px + env(safe-area-inset-right)) 6px}
.top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .logo{height:40px;width:auto;flex-shrink:0}
.top{border-bottom:1px solid var(--line);background:var(--card)}
.top .t1{font-weight:700;font-size:18px;line-height:1.15}
.top .t2{font-size:13px;color:var(--muted);font-weight:600}
/* Üst panel — ana uygulama ve sitedeki menü başlığıyla aynı: petrol zemin, amblem, altın vurgu */
.top{background:var(--soft);border-bottom:1px solid var(--line);color:var(--ink);border-radius:0 0 18px 18px;box-shadow:0 4px 14px rgba(15,47,56,.06);padding-bottom:14px;margin-bottom:12px}
.top .logo{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;box-sizing:border-box}
.top .t1{font-family:"Playfair Display",Georgia,serif;font-weight:400;color:var(--ink);font-size:19px}
.top .t2{color:var(--gold);font-size:12px;letter-spacing:.06em}
.top .iconbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px}
.iconbtn{margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px}
.kids{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.kidchip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap}
.kidchip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex-shrink:0}
main{flex:1;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.h{font-weight:700;font-size:19px;margin:2px 0 10px}
.muted{color:var(--muted);font-size:14px}
.status{border-radius:var(--r);padding:18px;color:#fff;display:flex;gap:14px;align-items:center;margin-bottom:14px;box-shadow:var(--shadow)}
.status .big{font-size:40px;line-height:1}
.status .s1{font-weight:700;font-size:20px;font-family:"Playfair Display",Georgia,serif}
.status .s2{opacity:.92;font-weight:700;font-size:14px}
.lesson{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--soft);border-left:3px solid var(--gold);margin-bottom:8px}
.lesson .em{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.lesson b{display:block;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.pill{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.btn{border:none;border-radius:10px;padding:14px 18px;font-weight:700;font-size:15.5px;background:var(--brand);color:#fff;min-height:50px;width:100%}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.coral{background:var(--gold)}
.btn.sm{width:auto;min-height:44px;padding:10px 14px;font-size:14.5px}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 14px;font-size:16px;outline:none;min-height:50px}
input.in:focus,textarea.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,146,63,.18)}
label.lb{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,47,56,.05);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
.nav .in2{display:flex;gap:4px;max-width:560px;width:100%}
.nav button{flex:1;border:none;background:none;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);min-height:56px;position:relative}
.nav button .e{font-size:21px}
.nav button.on{background:none;color:var(--ink);box-shadow:inset 0 2px 0 var(--ink);border-radius:0}
.dot{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;min-width:17px}
.bubble{max-width:82%;padding:10px 13px;border-radius:18px;margin:6px 0;white-space:pre-wrap;font-size:15px}
.bubble.me{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2b33;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.sheet-bd{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.scanov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.scanov .card{width:min(520px,100%);max-height:94vh;overflow:auto;margin:0}
.scanov video{width:100%;max-height:48vh;object-fit:cover;border-radius:14px;background:#0b2530;display:block}
.scanres{margin-top:10px;border-radius:14px;padding:12px;font-weight:800;font-size:16px;text-align:center}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:41;padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.langsel{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px;min-height:52px}
.langsel select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;border:none;background:transparent;font-weight:800;font-size:16px;padding:10px 0;outline:none;cursor:pointer}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.roles button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px}
.roles button .e{font-size:26px}
.roles button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chipb{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap;min-height:40px}
.chipb.on{border-color:var(--ink);background:var(--ink);color:#fff}
.attrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.attrow:last-child{border-bottom:none}
.attrow .nm{flex:1;min-width:0}
.attbtn{border:none;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;min-height:46px;min-width:74px}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.langs button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;font-weight:800;font-size:13.5px;min-height:48px}
.langs button.on{border-color:var(--brand);background:var(--soft)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.tg{width:54px;height:32px;border-radius:16px;background:var(--line);position:relative;border:none;flex-shrink:0}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:var(--gold)}.tg.on::after{left:26px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;font-weight:700;font-size:14px}
.chip button{border:none;background:none;font-size:15px;padding:0 2px}
/* Giriş */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 22px 30px}
.login .hero{text-align:center;margin-bottom:22px}
.login .hero img{height:110px;width:auto}
.medal{width:132px;height:132px;margin:0 auto;filter:drop-shadow(0 10px 18px rgba(15,47,56,.18))}
.medal svg{width:100%;height:100%;display:block}
.login .hero .ln{width:60px;height:1px;background:var(--gold);margin:14px auto 0}
.login h1{font-size:28px;font-weight:700;margin:14px 0 4px}
.login .tag{display:inline-block;color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.err{color:var(--bad);font-weight:800;font-size:14px;margin-top:10px;min-height:20px}
.links{text-align:center;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.links a,.links button{color:var(--brand2);font-weight:700;background:none;border:none;text-decoration:none;font-size:14.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .links a,:root:not([data-theme="light"]) .links button{color:#9fd3dc}}
/* Zarok modu */
.kidmode{position:fixed;inset:0;z-index:80;background:linear-gradient(170deg,#f6f3ee,#efe6d3);color:#0f2f38;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.kidmode h2{font-size:30px;font-weight:700;margin:6px 0 4px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.ktile{border:none;border-radius:16px;padding:20px 12px;min-height:130px;color:#fff;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(15,47,56,.18)}
.ktile .k{font-size:46px}
.klock{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:none;background:rgba(0,0,0,.08);font-size:22px;z-index:81}
.stars{font-size:34px;letter-spacing:2px;word-break:break-all}
canvas.draw{width:100%;height:58vh;background:#fff;border-radius:24px;touch-action:none;box-shadow:inset 0 0 0 3px #f1e3c6}
.pal{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pal button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pal button.on{outline:4px solid #1d2b33}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:16px auto}
.pin button{height:64px;border-radius:20px;border:none;background:#fff;font-size:24px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px}
.pindots i{width:16px;height:16px;border-radius:50%;background:#e4d3b3}
.pindots i.on{background:#1d2b33}
.center{text-align:center}
.spin{display:grid;place-items:center;flex:1;font-weight:800;color:var(--muted)}
</style>
</head>
