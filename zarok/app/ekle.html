<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Akademiya Zarokan — Ana ekrana ekle</title>
<meta name="theme-color" content="#0f2f38"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Akademiya Zarokan"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="icons/icon-v2-192.png"/>
<link rel="apple-touch-icon" href="icons/apple-v2-180.png"/>
<style>
:root{--ink:#0f2f38;--gold:#b8923f;--bg:#f6f3ee;--card:#fff;--muted:#5b6b70;--line:#e3ddd0}
@media (prefers-color-scheme:dark){:root{--bg:#0b1d23;--card:#132c34;--ink:#eef2f1;--muted:#a3b3b8;--line:#244049}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{text-align:center;margin:8px 0 16px}.hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(15,47,56,.25)}
h1{font-size:22px;margin:12px 0 4px}.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:17px;padding:16px;cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-size:15px;padding:12px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}.steps li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.steps li:last-child{border-bottom:0}
.n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ic{flex:0 0 36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.muted{color:var(--muted);font-size:13.5px}.ok{color:#15803d;font-weight:800;text-align:center}
.warn{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5200;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
#qr{display:flex;justify-content:center;padding:8px}.hide{display:none!important}
.copy{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang" id="lang"></div>
  <div class="hero"><img src="icons/icon-v2-192.png" alt=""/><h1 id="t-title"></h1><p class="sub" id="t-sub"></p></div>
  <div id="view"></div>
</div>
<script src="vendor/qrcode.min.js"></script>
<script>
(function(){
var TX={
 ku:{title:"Akademiya Zarokan",sub:"Sepanê li ser dîmendera sereke zêde bike",installed:"✅ Sepan berê sazkirî ye",open:"Sepanê veke",add:"Li dîmendera sereke zêde bike",
  dotsStep:"Li jêr rastê Safariyê sê xalan (⋯) bitikîne",shareStep:"“Parve bike” bitikîne",moreStep:"Li jêr “Bêtir” veke",addStep:"“Li Ekrana Sereke Zêde Bike” hilbijêre",confirmStep:"Li jora rastê “Zêde bike” bitikîne",
  safariOnly:"Ji bo iPhone / iPad divê vê girêdanê di Safariyê de vekî. Girêdanê kopî bike û di Safariyê de bişopîne.",
  androidSteps:"Li jor rastê Chrome sê xalan (⋮) bitikîne → “Saz bike û kurteriyê çêke” → “Saz bike”",androidWhy:"Ev bişkoj tenê li Chrome / Edge xuya dibe. Heke xuya nebe, ji bo vî tiştî rêbaza jêrîn bi kar bîne:",
  desktop:"Vê rûpelê bi têlefona xwe vekin: QR bi kamerayê bixwînin.",copy:"Girêdanê kopî bike",copied:"Kopî bû ✓",share:"Parve bike"},
 tr:{title:"Çocuk Akademisi",sub:"Uygulamayı ana ekrana ekleyin",installed:"✅ Uygulama zaten yüklü",open:"Uygulamayı aç",add:"Ana ekrana ekle",
  dotsStep:"Safari'de sağ alttaki üç noktaya (⋯) dokunun",shareStep:"“Paylaş”a dokunun",moreStep:"Aşağıda “Daha Fazla”yı açın",addStep:"“Ana Ekrana Ekle”yi seçin",confirmStep:"Sağ üstte “Ekle”ye dokunun",
  safariOnly:"iPhone / iPad'de bu bağlantı Safari'de açılmalıdır. Bağlantıyı kopyalayıp Safari'de açın.",
  androidSteps:"Chrome'da sağ üstteki üç noktaya (⋮) dokunun → “Yükle ve kısayol oluştur” → “Yükle”",androidWhy:"Bu düğme yalnızca Chrome / Edge'de çıkar. Çıkmazsa şu yolu izleyin:",
  desktop:"Bu sayfayı telefonunuzdan açın: QR kodu kamerayla okutun.",copy:"Bağlantıyı kopyala",copied:"Kopyalandı ✓",share:"Paylaş"},
 en:{title:"Children's Academy",sub:"Add the app to your home screen",installed:"✅ The app is already installed",open:"Open the app",add:"Add to home screen",
  dotsStep:"In Safari, tap the three dots (⋯) at the bottom right",shareStep:"Tap “Share”",moreStep:"Open “More” at the bottom",addStep:"Choose “Add to Home Screen”",confirmStep:"Tap “Add” at the top right",
  safariOnly:"On iPhone / iPad this link must be opened in Safari. Copy the link and open it in Safari.",
  androidSteps:"In Chrome, tap the three dots (⋮) at the top right → “Install and create shortcut” → “Install”",androidWhy:"This button only appears in Chrome / Edge. If it doesn't, follow this path:",
  desktop:"Open this page on your phone: scan the QR code with the camera.",copy:"Copy link",copied:"Copied ✓",share:"Share"}
};
var lang=(function(){var q=/[?&]lang=(ku|tr|en)/.exec(location.search);if(q)return q[1];try{var s=localStorage.getItem("zarok-lang");if(s&&TX[s])return s;}catch(e){}var n=(navigator.language||"").slice(0,2);return TX[n]?n:"ku";})();
var ua=navigator.userAgent||"";
var isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var isAndroid=/Android/i.test(ua);
var inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|Twitter|Snapchat|MicroMessenger|; wv\)/i.test(ua);
var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
var dp=null, installed=false;
var URLX=location.href.split("#")[0].split("?")[0];
var APP=new URL("./",location.href).href;
function $(i){return document.getElementById(i);}
function T(k){return TX[lang][k];}
var SHARE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
var PLUS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
var MENU='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
function copyBtn(){return '<button class="btn alt copy" id="copy" type="button">'+T("copy")+'</button>';}
function bindCopy(){var b=$("copy");if(!b)return;b.onclick=function(){var done=function(){b.textContent=T("copied");setTimeout(function(){b.textContent=T("copy");},1800);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(URLX).then(done,function(){prompt("",URLX);});}else{prompt("",URLX);}};}
function render(){
  $("t-title").textContent=T("title");$("t-sub").textContent=T("sub");document.documentElement.lang=lang;
  $("lang").innerHTML=["ku","tr","en"].map(function(l){return '<button type="button" data-l="'+l+'" class="'+(l===lang?"on":"")+'">'+l.toUpperCase()+'</button>';}).join("");
  [].forEach.call($("lang").querySelectorAll("button"),function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem("zarok-lang",lang);}catch(e){}render();};});
  var h="";
  if(standalone||installed){
    h='<div class="card"><div class="ok" data-state="installed">'+T("installed")+'</div></div><a class="btn" href="'+APP+'">'+T("open")+'</a>';
  }else if(isIOS){
    if(inApp) h+='<div class="warn" data-state="ios-inapp">'+T("safariOnly")+'</div>'+copyBtn();
    h+='<div class="card" data-state="ios"><ol class="steps">'
      +'<li><span class="n">1</span><span class="ic">⋯</span><span>'+T("dotsStep")+'</span></li>'
      +'<li><span class="n">2</span><span class="ic">'+SHARE+'</span><span>'+T("shareStep")+'</span></li>'
      +'<li><span class="n">3</span><span class="ic">⌄</span><span>'+T("moreStep")+'</span></li>'
      +'<li><span class="n">4</span><span class="ic">'+PLUS+'</span><span>'+T("addStep")+'</span></li>'
      +'<li><span class="n">5</span><span class="ic">✓</span><span>'+T("confirmStep")+'</span></li></ol></div>'+(inApp?"":copyBtn());
  }else if(isAndroid){
    if(dp) h+='<button class="btn" id="inst" type="button" data-state="android-prompt">➕ '+T("add")+'</button>';
    h+='<div class="card" data-state="android"><div class="muted" style="margin-bottom:8px">'+(dp?"":T("androidWhy"))+'</div><ol class="steps"><li><span class="n">1</span><span class="ic">'+MENU+'</span><span>'+T("androidSteps")+'</span></li></ol></div>'+copyBtn();
  }else{
    h='<div class="card" data-state="desktop"><div class="muted" style="text-align:center">'+T("desktop")+'</div><div id="qr"></div></div>'+copyBtn();
    if(dp) h+='<button class="btn" id="inst" type="button" style="margin-top:10px">➕ '+T("add")+'</button>';
  }
  $("view").innerHTML=h;
  var ib=$("inst");if(ib)ib.onclick=function(){dp.prompt();dp.userChoice.then(function(c){dp=null;render();});};
  bindCopy();
  var q=$("qr");if(q&&window.QRCode){new QRCode(q,{text:URLX,width:184,height:184,colorDark:"#0f2f38",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}
}
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;render();});
addEventListener("appinstalled",function(){installed=true;render();});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});}
render();
})();
</script>
</body>
</html>
